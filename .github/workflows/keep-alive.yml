name: Keep Backend Alive

# Faz um ping periódico no backend hospedado no Render para evitar que ele
# hiberne por inatividade (comportamento padrão do free tier). O Render
# derruba a instância após ~15 min sem tráfego e o próximo request "acorda"
# o servidor, o que pode levar até 50s — essa rotina evita que isso
# aconteça na frente do usuário.
#
# Reaproveita o mesmo secret VITE_API_BASE_URL já usado no deploy.yml, então
# nenhuma configuração extra é necessária além do que já existe no repo.

on:
  schedule:
    # A cada 14 minutos. GitHub Actions não garante o minuto exato do cron
    # (pode atrasar alguns minutos em horários de pico), então 14 em vez de
    # 15 dá uma margem de segurança para não passar do limite de hibernação.
    - cron: '*/14 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          if [ -z "${{ secrets.VITE_API_BASE_URL }}" ]; then
            echo "VITE_API_BASE_URL não configurada, pulando ping."
            exit 0
          fi

          echo "Pingando ${{ secrets.VITE_API_BASE_URL }}/api/session ..."
          curl -sS -o /dev/null -w "Status: %{http_code} | Tempo: %{time_total}s\n" \
            --max-time 60 \
            "${{ secrets.VITE_API_BASE_URL }}/api/session" \
            -X POST || echo "Ping falhou, mas não é crítico (o servidor pode simplesmente acordar no próximo request real)."
