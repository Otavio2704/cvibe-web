name: Keep Backend Alive

on:
  schedule:
    # A cada 14 minutos. GitHub Actions não garante o minuto exato do cron
    # (pode atrasar alguns minutos em horários de pico), então 14 em vez de
    # 15 dá uma margem de segurança para não passar do limite de hibernação.
    - cron: '*/14 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          if [ -z "${{ secrets.VITE_API_BASE_URL }}" ]; then
            echo "VITE_API_BASE_URL não configurada, pulando ping."
            exit 0
          fi

          echo "Pingando .../api/session ..."
          curl -sS -D - -o /tmp/body.txt -w "\nStatus: %{http_code} | Tempo: %{time_total}s\n" \
            --max-time 60 \
            "${{ secrets.VITE_API_BASE_URL }}/api/session" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Origin: https://otavio2704.github.io" \
            || echo "Ping falhou, mas não é crítico (o servidor pode simplesmente acordar no próximo request real)."

          echo "--- Corpo da resposta ---"
          cat /tmp/body.txt || true
